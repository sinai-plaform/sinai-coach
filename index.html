<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#18221C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SINAI Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --surface2:#E9EDE6; --ink:#18221C; --muted:#5F6D64; --line:#D7DDD4;
  --accent:#DD6A2C; --accent-ink:#fff; --pitch:#3F8F5E; --pitch2:#3A865A;
  --ok:#2A8F6A; --warn:#D98A2B; --bad:#C43B33; --info:#2E6FB5;
  --ta:#2E6FB5; --tb:#C43B33; --tn:#F2C14E; --tgk:#7A4FB3; --tco:#1E1E1E;
  --shadow:0 10px 30px rgba(20,30,24,.12); --r:14px;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#1A221D; --surface2:#222C26; --ink:#EEF2EC; --muted:#9DAAA1; --line:#2B362F;
  --accent:#F0813F; --pitch:#2F6E49; --pitch2:#2B6644; --shadow:0 10px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#1A221D; --surface2:#222C26; --ink:#EEF2EC; --muted:#9DAAA1; --line:#2B362F;
  --accent:#F0813F; --pitch:#2F6E49; --pitch2:#2B6644; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,Arial,sans-serif;font-size:15px;line-height:1.5;
  padding-top:var(--safeT);overscroll-behavior-y:none}
h1,h2,h3{font-family:"Secular One",Heebo,sans-serif;font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:24px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:12px}
.hide{display:none!important}

/* layout */
#app{min-height:100%;padding-bottom:calc(72px + var(--safeB))}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 20px}
.topbar{position:sticky;top:var(--safeT);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--surface);border:1px solid var(--line)}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--safeB);box-shadow:0 -6px 20px rgba(0,0,0,.07)}
.nav .in{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:var(--accent);font-weight:500}

/* cards & bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:500;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.big{padding:14px;font-size:16px;width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;background:var(--surface2)}
.pill.ok{background:rgba(42,143,106,.15);color:var(--ok)}
.pill.bad{background:rgba(196,59,51,.15);color:var(--bad)}
.pill.warn{background:rgba(217,138,43,.16);color:var(--warn)}
.pill.info{background:rgba(46,111,181,.15);color:var(--info)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sep{height:1px;background:var(--line);margin:12px -14px}
.empty{padding:34px 14px;text-align:center;color:var(--muted)}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 8px}
.hd h2{font-size:17px}

/* player tiles */
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.av{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--muted)}
.av.a{background:rgba(46,111,181,.18);color:var(--ta)} .av.b{background:rgba(196,59,51,.18);color:var(--tb)}
.pname{flex:1;min-width:0}
.pname b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;position:relative;min-height:66px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile b{font-weight:500;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(221,106,44,.22)}
.tile .dot{position:absolute;top:6px;inset-inline-end:6px;width:8px;height:8px;border-radius:50%}
.tile .cnt{position:absolute;top:5px;inset-inline-start:7px;font-size:11px;color:var(--accent);font-weight:700}
.tile.off{opacity:.42}
.tile.ta{border-inline-start:4px solid var(--ta)} .tile.tb{border-inline-start:4px solid var(--tb)}

/* score buttons */
.scorerow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scorerow button{border:1px solid var(--line);border-radius:10px;padding:13px 0;font-weight:700;font-size:17px;background:var(--surface)}
.scorerow button[data-s="1"]{color:var(--bad)} .scorerow button[data-s="2"]{color:#C07A2B}
.scorerow button[data-s="4"]{color:#3E8F5E} .scorerow button[data-s="5"]{color:var(--ok)}
.starrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.starrow button{border:1px solid var(--line);border-radius:10px;padding:14px 0;font-size:19px;background:var(--surface)}

/* sheet / modal */
.sheetwrap{position:fixed;inset:0;z-index:60;display:none}
.sheetwrap.open{display:block}
.sheetwrap .bd{position:absolute;inset:0;background:rgba(10,14,12,.5)}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;
  max-height:88vh;overflow:auto;padding:16px 16px calc(18px + var(--safeB));box-shadow:var(--shadow);animation:up .18s ease}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* timer */
.timer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.timer .t{font-family:"Secular One",sans-serif;font-size:38px;line-height:1}
.timer .bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.timer .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s linear}
.timer .bar i.over{background:var(--bad)}

/* attribute bars */
.attr{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 0;font-size:14px}
.attr .bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.attr .bar i{display:block;height:100%;border-radius:99px}
.attr .v{font-weight:700;min-width:28px;text-align:end}
.attr .tr{width:16px;text-align:center;font-size:12px}
.attr.dim{opacity:.5}

/* diagram */
.dg{width:100%;aspect-ratio:3/2;border-radius:10px;display:block}
.toast{position:fixed;bottom:calc(86px + var(--safeB));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.banner{background:var(--warn);color:#fff;text-align:center;padding:5px;font-size:12.5px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th,table.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start}
table.tbl th{color:var(--muted);font-weight:500;font-size:12.5px}
.scroll-x{overflow-x:auto}
</style>
</head>
<body>
<div id="offlineBar" class="banner hide">אופליין — הנתונים נשמרים במכשיר ויסונכרנו אוטומטית</div>
<div id="app"></div>
<nav class="nav hide" id="nav"><div class="in">
  <button data-go="home"><span class="ic">🏠</span>היום</button>
  <button data-go="squad"><span class="ic">👥</span>סגל</button>
  <button data-go="plan"><span class="ic">📋</span>אימון</button>
  <button data-go="library"><span class="ic">⚽</span>ספרייה</button>
  <button data-go="more"><span class="ic">⋯</span>עוד</button>
</div></nav>
<div class="sheetwrap" id="sheetWrap"><div class="bd" id="sheetBd"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>// ===== ספריית תרגילים — נתונים =====

function C(x,y){return {t:'c',x,y};}
function sq(x,y,w,h){return [C(x,y),C(x+w,y),C(x,y+h),C(x+w,y+h)];}
function P(x,y,s,n){return {t:'p',x,y,s,n};}
function pass(...pts){return {t:'pass',pts};}
function run(...pts){return {t:'run',pts};}
function drib(...pts){return {t:'drib',pts};}
function shot(...pts){return {t:'shot',pts};}
function ball(x,y){return {t:'ball',x,y};}
function goal(x,y,dir,w){return {t:'goal',x,y,dir,w:w||16};}
function mg(x,y,dir){return {t:'mg',x,y,dir};}
function zone(x,y,w,h,label){return {t:'zone',x,y,w,h,label};}
function line(x1,y1,x2,y2){return {t:'line',x1,y1,x2,y2};}
function txt(x,y,s){return {t:'txt',x,y,s};}
function hoop(x,y){return {t:'hoop',x,y};}
function ring(cx,cy,r){return {t:'ring',cx,cy,r};}

  trans:{label:'מעברים ולחץ',short:'מעברים'},
  ssg:{label:'משחקים קטנים',short:'משחק'},
  cool:{label:'שחרור וסיכום',short:'סיכום'}
};
const AGES = {a:'גן–ב׳', b:'ג׳–ד׳', c:'ה׳–ז׳'};

const DRILLS = [
// ---------- הפעלה ----------
{id:'w1',name:'כדור לכל ילד — שליטה עם פקודות',cat:'warm',ages:['a','b'],min:10,players:'8–16',area:'20×20',
 equip:'כדור לכל ילד, 4 קונוסים',

{id:'w2',name:'מסירות בזוגות בתנועה',cat:'warm',ages:['b','c'],min:10,players:'8–16',area:'30×20',

let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2000);}
function age(bd){if(!bd)return null;const b=new Date(bd),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a;}

/* ---------- offline queue ---------- */
let QUEUE = LS('queue')||[];
const saveQ=()=>LS('queue',QUEUE);
async function push(table, rows, opts){
  rows = Array.isArray(rows)?rows:[rows];
  if(!S.online){ QUEUE.push({table,rows,opts:opts||{}}); saveQ(); renderOffline(); return {queued:true}; }
  try{
    let q = sb.from(table);
    const r = opts&&opts.upsert ? await q.upsert(rows,{onConflict:opts.onConflict}).select() : await q.insert(rows).select();
    if(r.error) throw r.error;
    return {data:r.data};
  }catch(e){
    QUEUE.push({table,rows,opts:opts||{}}); saveQ(); renderOffline();
    console.warn('queued',table,e.message); return {queued:true};
  }
}
async function flushQueue(){
  if(!QUEUE.length||!S.online) return;
  const left=[];
  for(const it of QUEUE){
    try{
      const q=sb.from(it.table);
      const r = it.opts.upsert ? await q.upsert(it.rows,{onConflict:it.opts.onConflict}) : await q.insert(it.rows);
      if(r.error) throw r.error;
    }catch(e){ left.push(it); }
  }
  const n=QUEUE.length-left.length; QUEUE=left; saveQ(); renderOffline();
  if(n>0) toast(`סונכרנו ${n} רשומות`);
}
function renderOffline(){
  const b=$('#offlineBar');
  if(!S.online){ b.classList.remove('hide'); b.textContent='אופליין — הנתונים נשמרים במכשיר ויסונכרנו אוטומטית'; }
  else if(QUEUE.length){ b.classList.remove('hide'); b.style.background='var(--info)'; b.textContent=`ממתינים לסנכרון: ${QUEUE.length}`; }
  else b.classList.add('hide');
}
addEventListener('online',()=>{S.online=true;renderOffline();flushQueue();});
addEventListener('offline',()=>{S.online=false;renderOffline();});

/* ---------- diagrams (same format as the library) ---------- */
const TEAMC={a:'var(--ta)',b:'var(--tb)',n:'var(--tn)',gk:'var(--tgk)',co:'var(--tco)'};
function zig(pts){let d='';for(let i=0;i<pts.length-1;i++){const [x1,y1]=pts[i],[x2,y2]=pts[i+1];const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,n=Math.max(2,Math.round(len/3));const nx=-dy/len*1.3,ny=dx/len*1.3;if(i===0)d+=`M${x1},${y1}`;for(let k=1;k<=n;k++){const t=k/n,s=(k%2?1:-1)*(k===n?0:1);d+=` L${(x1+dx*t+nx*s).toFixed(1)},${(y1+dy*t+ny*s).toFixed(1)}`;}}return d;}
const poly=p=>p.map(x=>x.join(',')).join(' ');
function gr(it,w,depth){const x=it.x,y=it.y;if(it.dir==='w')return[x-depth,y-w/2,depth,w];if(it.dir==='e')return[x,y-w/2,depth,w];if(it.dir==='n')return[x-w/2,y-depth,w,depth];return[x-w/2,y,w,depth];}
function svgDiag(d,cls){
  const items=(d&&d.items)||[];
  let s=`<svg class="${cls||'dg'}" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="דיאגרמה"><defs>
  <marker id="aW" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 Z" fill="#fff"/></marker>
  <marker id="aO" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 Z" fill="#FFD166"/></marker>
  <pattern id="nt" width="1.5" height="1.5" patternUnits="userSpaceOnUse"><path d="M0,0 L1.5,1.5 M1.5,0 L0,1.5" stroke="#fff" stroke-width=".25"/></pattern></defs>
  <rect width="120" height="80" fill="var(--pitch)"/>`;
  for(let i=1;i<6;i+=2)s+=`<rect x="${i*20}" y="0" width="20" height="80" fill="var(--pitch2)"/>`;
  const later=[];
  items.forEach(it=>{switch(it.t){
    case 'zone':s+=`<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="#fff" fill-opacity=".10"/>`+(it.label?`<text x="${it.x+it.w/2}" y="${it.y+5}" font-size="3.4" fill="#fff" fill-opacity=".85" text-anchor="middle">${esc(it.label)}</text>`:'');break;
    case 'line':s+=`<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="#fff" stroke-width=".6" stroke-opacity=".8"/>`;break;
    case 'ring':s+=`<circle cx="${it.cx}" cy="${it.cy}" r="${it.r}" fill="none" stroke="#fff" stroke-width=".6" stroke-dasharray="2 1.5" stroke-opacity=".8"/>`;break;
    case 'hoop':s+=`<circle cx="${it.x}" cy="${it.y}" r="3.6" fill="none" stroke="#FFD166" stroke-width="1"/>`;break;
    case 'goal':{const[a,b,c,d2]=gr(it,it.w||16,4);s+=`<rect x="${a}" y="${b}" width="${c}" height="${d2}" fill="url(#nt)" stroke="#fff" stroke-width=".8"/>`;break;}
    case 'mg':{const[a,b,c,d2]=gr(it,7,2.2);s+=`<rect x="${a}" y="${b}" width="${c}" height="${d2}" fill="url(#nt)" stroke="#fff" stroke-width=".8"/>`;break;}
    case 'c':s+=`<path d="M${it.x},${it.y-2.3} L${it.x+2.1},${it.y+1.6} L${it.x-2.1},${it.y+1.6} Z" fill="${it.col||'#F2C14E'}" stroke="#000" stroke-opacity=".25" stroke-width=".3"/>`;break;
    case 'pass':later.push(`<polyline points="${poly(it.pts)}" fill="none" stroke="#fff" stroke-width=".8" stroke-dasharray="2 1.4" marker-end="url(#aW)"/>`);break;
    case 'run':later.push(`<polyline points="${poly(it.pts)}" fill="none" stroke="#FFD166" stroke-width=".7" marker-end="url(#aO)"/>`);break;
    case 'drib':later.push(`<path d="${zig(it.pts)}" fill="none" stroke="#fff" stroke-width=".7" marker-end="url(#aW)"/>`);break;
    case 'shot':later.push(`<polyline points="${poly(it.pts)}" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#aW)"/>`);break;
    case 'p':later.push(`<circle cx="${it.x}" cy="${it.y}" r="3.3" fill="${TEAMC[it.s]||TEAMC.a}" stroke="#fff" stroke-width=".7"/>`+(it.n?`<text x="${it.x}" y="${it.y+1.2}" font-size="${String(it.n).length>1?2.4:3.2}" fill="#fff" text-anchor="middle" font-weight="700">${esc(it.n)}</text>`:(it.s==='co'?`<text x="${it.x}" y="${it.y+1.2}" font-size="3" fill="#fff" text-anchor="middle" font-weight="700">מ</text>`:'')));break;
    case 'ball':later.push(`<circle cx="${it.x}" cy="${it.y}" r="1.7" fill="#fff" stroke="#1E1E1E" stroke-width=".45"/><circle cx="${it.x}" cy="${it.y}" r=".6" fill="#1E1E1E"/>`);break;
    case 'txt':later.push(`<text x="${it.x}" y="${it.y}" font-size="3.4" fill="#fff" text-anchor="middle" paint-order="stroke" stroke="#0B2A18" stroke-width=".9" stroke-opacity=".7">${esc(it.s)}</text>`);break;
  }});
  return s+later.join('')+'</svg>';
}

/* ---------- attribute scores (client-side, same formula as the DB view) ---------- */
function scoreFromObs(obs){
  const now=Date.now(); const byAttr={};
  obs.forEach(o=>{
    const days=(now-new Date(o.at).getTime())/864e5;
    if(days>400) return;
    const srcW = o.source==='match'||o.source==='test' ? 1.5 : o.source==='challenge' ? 0.7 : 1;
    const w = srcW*Math.pow(0.5, days/21);
    const b = byAttr[o.attribute] || (byAttr[o.attribute]={sw:0,sws:0,n90:0,r:[],p:[]});
    b.sw+=w; b.sws+=w*o.score;
    if(days<=90)b.n90++;
    if(days<=30)b.r.push(o.score); else if(days<=120)b.p.push(o.score);
  });
  const out={};
  for(const [k,b] of Object.entries(byAttr)){
    const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    const r=avg(b.r), p=avg(b.p);
    out[k]={score:b.sw?+(4*b.sws/b.sw).toFixed(1):null, n90:b.n90,
      conf: b.n90>=25?'high':b.n90>=10?'med':b.n90>=3?'low':'none',
      trend: (r!=null&&p!=null)? +(4*(r-p)).toFixed(1) : null};
  }
  return out;
}

const planMin=()=>PLAN.items.reduce((s,i)=>s+(+i.min||0),0);
VIEWS.plan = function(){

  screen('בניית אימון', `
    <div class="card stack">

        <span class="pill ${t>target?'bad':t===target?'ok':''}">${t>target?'חריגה '+(t-target)+'׳':'נשארו '+(target-t)+'׳'}</span></div>
      <div class="timer" style="padding:0;border:0"><div class="bar"><i style="width:${Math.min(100,t/target*100)}%" class="${t>target?'over':''}"></i></div></div>

  renderPlanList();
  $('#startBtn').onclick=startSession;
};
function renderPlanList(){
  const el=$('#plist'); if(!el) return;
  el.innerHTML = PLAN.items.length? PLAN.items.map((it,i)=>{
    const d=drillById(it.id)||{name:'תרגיל',cat:'tech'};
    return `<div class="prow"><div class="av">${i+1}</div>
      <div class="pname"><b>${esc(d.name)}</b><span class="xs muted">${esc(CATS[d.cat]?.short||'')} · ${esc(d.src||'')}</span></div>
      <input type="number" class="num" style="width:58px;padding:5px;text-align:center" value="${it.min}" onchange="setMin(${i},this.value)">
      <button class="btn sm ghost" onclick="movePlan(${i},-1)">↑</button>
      <button class="btn sm ghost" onclick="movePlan(${i},1)">↓</button>
      <button class="btn sm ghost" onclick="delPlan(${i})">✕</button></div>`;
  }).join('') : '<p class="muted sm">עוד אין תרגילים — הוסיפו מהספרייה או טענו תבנית.</p>';
}
function setMin(i,v){PLAN.items[i].min=Math.max(1,+v||1);LS('plan',PLAN);go('plan');}
function movePlan(i,d){const j=i+d;if(j<0||j>=PLAN.items.length)return;[PLAN.items[i],PLAN.items[j]]=[PLAN.items[j],PLAN.items[i]];LS('plan',PLAN);go('plan');}
function delPlan(i){PLAN.items.splice(i,1);LS('plan',PLAN);go('plan');}
function loadTpl(k){const t=TEMPLATES[k];PLAN.items=t.items.map(([id,min])=>({id,min}));PLAN.focus=PLAN.focus||t.label;LS('plan',PLAN);go('plan');toast('התבנית נטענה');}
function addToPlan(id,min){const d=drillById(id);PLAN.items.push({id,min:min||d.min});LS('plan',PLAN);toast('נוסף לאימון');}

async function startSession(){
  const row={team_id:S.team.id,date:today(),focus:PLAN.focus||null,planned_minutes:planMin(),status:'live'};
  const {data,error}=await sb.from('coach_sessions').insert(row).select().single();
  if(error) return toast('שגיאה: '+error.message);
  const sd=PLAN.items.map((it,i)=>({session_id:data.id,drill_id:it.id,ord:i,minutes:it.min}));
  await sb.from('coach_session_drills').insert(sd);
  S.session=data; S.sessionDrills=PLAN.items.map((it,i)=>({...it,ord:i}));
  go('attend');
}
async function openSession(id){

      <button class="btn" style="flex:1" onclick="quickRound()">סבב מהיר</button>
      <button class="btn" style="flex:1" onclick="go('attend')">נוכחות</button>

  drawTiles();

function drawTiles(){
  const el=$('#tiles'); if(!el)return;
  const pl=presentPlayers().length?presentPlayers():S.players;
  el.innerHTML=pl.map(p=>{
    const n=localCounts(p.id,S.session?.id);
    return `<button class="tile" onclick="ratePlayer('${p.id}')">${n?`<span class="cnt">${n}</span>`:''}
      <b>${esc(p.name.split(' ')[0])}</b><span class="xs muted">${p.shirt_no?'#'+p.shirt_no:''}</span></button>`;
  }).join('');
}
function toggleTimer(){
  const it=S.sessionDrills[LIVE.idx];
  if(LIVE.timer){ clearInterval(LIVE.timer); LIVE.timer=null; $('#pp').textContent='▶ המשך'; return; }
  if(!LIVE.start) LIVE.start=Date.now();
  else LIVE.start=Date.now()-(LIVE.elapsed||0);
  LIVE.timer=setInterval(updateClock,250); $('#pp').textContent='⏸ עצור';
}
function updateClock(){
  const it=S.sessionDrills[LIVE.idx]; if(!it||!$('#clk'))return;
  const total=it.min*60;
  LIVE.elapsed = LIVE.start? Date.now()-LIVE.start : 0;
  const left=Math.max(0,total-Math.floor(LIVE.elapsed/1000));
  const over=Math.floor(LIVE.elapsed/1000)-total;
  $('#clk').textContent = over>0 ? '+'+String(Math.floor(over/60)).padStart(2,'0')+':'+String(over%60).padStart(2,'0')
    : String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  const bar=$('#pbar'); if(bar){bar.style.width=Math.min(100,Math.floor(LIVE.elapsed/1000)/total*100)+'%';bar.classList.toggle('over',over>0);}
  if(over===0 && LIVE.elapsed>1000 && !LIVE.dinged){LIVE.dinged=true;try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
}
function resetTimer(){clearInterval(LIVE.timer);LIVE.timer=null;LIVE.start=0;LIVE.elapsed=0;LIVE.dinged=false;}
function prevDrill(){resetTimer();LIVE.idx=Math.max(0,LIVE.idx-1);go('live');}

  if(LIVE.idx<S.sessionDrills.length-1){LIVE.idx++;go('live');}
  else endSession();
}

let MATCH={clock:0,timer:null,running:false,half:1};
VIEWS.match = async function(){

      </div>
      <div id="splitBox"></div>`);

  }
  renderMatch();
};
async function splitAuto(){
  const pool=(presentPlayers().length?presentPlayers():S.players.filter(p=>p.status==='active'));
  const ids=pool.map(p=>p.id);
  let obs=[];
  if(ids.length){const {data}=await sb.from('coach_observations').select('player_id,attribute,score,source,at').in('player_id',ids).eq('voided',false).limit(4000);obs=data||[];}
  LOCAL_OBS.filter(o=>ids.includes(o.player_id)).forEach(o=>obs.push(o));
  const byP={}; obs.forEach(o=>(byP[o.player_id]=byP[o.player_id]||[]).push(o));
  const rated=pool.map(p=>{const sc=scoreFromObs(byP[p.id]||[]);const v=Object.values(sc).map(x=>x.score).filter(Boolean);
    return {p,v:v.length?v.reduce((a,b)=>a+b,0)/v.length:10};}).sort((a,b)=>b.v-a.v);
  const A=[],B=[]; let sa=0,sb2=0;
  rated.forEach(r=>{
    const toA = A.length===B.length ? (sa<=sb2) : (A.length<B.length);
    if(toA){A.push(r.p);sa+=r.v;} else {B.push(r.p);sb2+=r.v;}
  });
  MATCH.split={a:A.map(p=>p.id),b:B.map(p=>p.id),sa,sb:sb2};
  renderSplit();
}
function splitManual(){
  const pool=presentPlayers().length?presentPlayers():S.players.filter(p=>p.status==='active');
  MATCH.split={a:[],b:[],manual:true};
  renderSplit();
}
function renderSplit(){
  const pool=presentPlayers().length?presentPlayers():S.players.filter(p=>p.status==='active');
  const sp=MATCH.split;
  const avgA = sp.sa&&sp.a.length ? sp.sa/sp.a.length : null, avgB = sp.sb&&sp.b.length ? sp.sb/sp.b.length : null;
  const bal = (avgA&&avgB) ? Math.round(Math.abs(avgA-avgB)/((avgA+avgB)/2)*100) : null;
  $('#splitBox').innerHTML=`
    <div class="hd"><h2>החלוקה</h2>${bal!=null?`<span class="pill ${bal>10?'warn':'ok'}">פער ${bal}%</span>`:''}</div>
    <div class="grid2">
      <div class="card" style="border-top:3px solid var(--ta)"><h3 style="color:var(--ta)">קבוצה א׳ · אפוד כחול</h3>
        <div class="stack" style="margin-top:8px">${sp.a.map(id=>pRow(id,'a')).join('')||'<p class="xs muted">ריק</p>'}</div></div>
      <div class="card" style="border-top:3px solid var(--tb)"><h3 style="color:var(--tb)">קבוצה ב׳ · אפוד אדום</h3>
        <div class="stack" style="margin-top:8px">${sp.b.map(id=>pRow(id,'b')).join('')||'<p class="xs muted">ריק</p>'}</div></div>
    </div>
    ${pool.filter(p=>!sp.a.includes(p.id)&&!sp.b.includes(p.id)).length?`<div class="hd"><h2>לשבץ</h2></div>
      <div class="tiles">${pool.filter(p=>!sp.a.includes(p.id)&&!sp.b.includes(p.id)).map(p=>`
        <div class="tile"><b>${esc(p.name.split(' ')[0])}</b>
          <div class="row" style="gap:4px;margin-top:5px;justify-content:center">
            <button class="btn sm" style="padding:3px 9px;color:var(--ta)" onclick="assign('${p.id}','a')">א׳</button>
            <button class="btn sm" style="padding:3px 9px;color:var(--tb)" onclick="assign('${p.id}','b')">ב׳</button></div></div>`).join('')}</div>`:''}
    <button class="btn primary big" style="margin-top:14px" onclick="beginMatch()" ${sp.a.length&&sp.b.length?'':'disabled'}>התחל משחק</button>
    <button class="btn ghost" style="margin-top:8px;width:100%" onclick="splitAuto()">ערבב שוב</button>`;
}
function pRow(id,side){const p=S.players.find(x=>x.id===id)||{name:'—'};
  return `<div class="row" style="gap:6px"><div class="av ${side}" style="width:28px;height:28px;font-size:11px">${esc(initials(p.name))}</div>

async function beginMatch(){

function renderMatch(){
  const m=S.match, sp=m.split||{a:[],b:[]};
  screen('משחק', `
    <div class="timer">
      <div class="spread">
        <div style="text-align:center;flex:1"><p class="xs muted">קבוצה א׳</p><div class="t num" style="color:var(--ta)" id="sa">${m.score_a}</div></div>

    else{MATCH.timer=setInterval(()=>{MATCH.clock++;const c=$('#mclk');if(c)c.textContent=String(Math.floor(MATCH.clock/60)).padStart(2,'0')+':'+String(MATCH.clock%60).padStart(2,'0');},1000);$('#mpp').textContent='⏸';}
  };

function drawMatchTiles(){
  const sp=S.match?.split||{a:[],b:[]};
  const draw=(ids,cls)=>ids.map(id=>{const p=S.players.find(x=>x.id===id);if(!p)return'';
    const n=LOCAL_OBS.filter(o=>o.player_id===id&&o.match_id===S.match.id).length;
    return `<button class="tile t${cls}" onclick="matchTap('${id}')">${n?`<span class="cnt">${n}</span>`:''}

async function mEvent(pid,type,side){
  const minute=Math.floor(MATCH.clock/60);
  await push('coach_match_events',{match_id:S.match.id,player_id:pid,type,minute});
  if(type==='goal'){
    if(side==='a')S.match.score_a++; else S.match.score_b++;
    await sb.from('coach_matches').update({score_a:S.match.score_a,score_b:S.match.score_b}).eq('id',S.match.id);
    const el=$(side==='a'?'#sa':'#sb2'); if(el)el.textContent=side==='a'?S.match.score_a:S.match.score_b;
    await addObs(pid,'shooting',5,{source:'match',match_id:S.match.id});
  } else await addObs(pid,'passing',5,{source:'match',match_id:S.match.id});
  closeSheet(); drawMatchTiles(); toast(type==='goal'?'שער!':'בישול');
}
function halfEnd(){ MATCH.half++; MATCH.clock=0; clearInterval(MATCH.timer); MATCH.timer=null;
  const h=$('#mh'); if(h)h.textContent=MATCH.half; const c=$('#mclk'); if(c)c.textContent='00:00';
  const b=$('#mpp'); if(b)b.textContent='▶'; toast('מחצית '+MATCH.half); }
function endMatch(){
  clearInterval(MATCH.timer); MATCH.timer=null;
  const all=[...(S.match.split.a||[]),...(S.match.split.b||[])];
  let i=0;
  const step=()=>{
    if(i>=all.length){ finishMatch(); return; }
    const p=S.players.find(x=>x.id===all[i]);
    if(!p){i++;return step();}
    sheet(`<p class="xs muted">ציון משחק ${i+1}/${all.length}</p><h2>${esc(p.name)}</h2>
      <div class="scorerow" style="margin-top:12px;grid-template-columns:repeat(5,1fr)">

function radar(attrs,sc){
  const pts=attrs.slice(0,8);
  if(pts.length<3) return '';
  const cx=60,cy=60,R=48;
  const ang=i=>(-Math.PI/2)+(i*2*Math.PI/pts.length);
  const ring=r=>pts.map((_,i)=>[(cx+r*Math.cos(ang(i))).toFixed(1),(cy+r*Math.sin(ang(i))).toFixed(1)].join(',')).join(' ');
  const poly2=pts.map((a,i)=>{const v=(sc[a.key]?.score||0)/20;return [(cx+R*v*Math.cos(ang(i))).toFixed(1),(cy+R*v*Math.sin(ang(i))).toFixed(1)].join(',');}).join(' ');
  return `<svg viewBox="0 0 120 120" style="width:100%;max-width:280px;margin:0 auto;display:block">
    ${[0.25,0.5,0.75,1].map(r=>`<polygon points="${ring(R*r)}" fill="none" stroke="var(--line)" stroke-width=".6"/>`).join('')}
    ${pts.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${(cx+R*Math.cos(ang(i))).toFixed(1)}" y2="${(cy+R*Math.sin(ang(i))).toFixed(1)}" stroke="var(--line)" stroke-width=".5"/>`).join('')}
    <polygon points="${poly2}" fill="var(--accent)" fill-opacity=".28" stroke="var(--accent)" stroke-width="1.4"/>
    ${pts.map((a,i)=>{const x=cx+(R+9)*Math.cos(ang(i)),y=cy+(R+9)*Math.sin(ang(i));
      return `<text x="${x.toFixed(1)}" y="${(y+1.5).toFixed(1)}" font-size="5" fill="var(--muted)" text-anchor="middle">${esc(a.label)}</text>`;}).join('')}
  </svg>`;
}

VIEWS.tests = function(){
  const protos=[{k:'ספרינט 20 מ׳',u:'sec',d:20},{k:'ספרינט 10 מ׳',u:'sec',d:10},{k:'זריזות 5-10-5',u:'sec',d:20},
    {k:'קפיצה למרחק',u:'cm'},{k:'הקפצות ב-60 שנ׳',u:'reps'},{k:'מסירות לקיר ב-30 שנ׳',u:'reps'}];
  screen('מדידות', `
    <div class="card stack">
      <label class="f">מבחן<select id="tp">${protos.map(p=>`<option value="${esc(p.k)}" data-u="${p.u}" data-d="${p.d||''}">${esc(p.k)}</option>`).join('')}</select></label>
      <label class="f">מרחק (מ׳) — אם רלוונטי<input id="td" type="number" class="num" value="20"></label>
      <p class="xs muted">לחיצה על שחקן מתחילה ספירה; לחיצה שנייה עוצרת. במצב קבוצתי לוחצים "התחל לכולם" ואז מקישים על כל שחקן כשהוא חוצה.</p>
      <div class="row" style="gap:8px"><button class="btn" style="flex:1" id="grpStart">התחל לכולם</button>
        <button class="btn ghost" style="flex:1" id="grpReset">איפוס</button></div>
    </div>
    <div class="hd"><h2>שחקנים</h2></div>
    <div class="tiles" id="ttiles"></div>
    <button class="btn primary big" style="margin-top:14px" id="saveT">שמירת התוצאות</button>`);
  TIMERS={}; let groupStart=0, tick=null;
  const draw=()=>{ $('#ttiles').innerHTML=S.players.map(p=>{
      const v=TIMERS[p.id];
      return `<button class="tile ${v&&v.done?'on':''}" onclick="tapTest('${p.id}')">
        <b>${esc(p.name.split(' ')[0])}</b><span class="num sm">${v?(v.done?v.val.toFixed(2):'…'):'—'}</span></button>`;}).join(''); };
  window.tapTest=(pid)=>{
    const now=performance.now();
    if(groupStart){ if(!TIMERS[pid]||!TIMERS[pid].done) TIMERS[pid]={done:true,val:(now-groupStart)/1000}; else delete TIMERS[pid]; }
    else{
      const t=TIMERS[pid];
      if(!t) TIMERS[pid]={start:now};
      else if(!t.done) TIMERS[pid]={done:true,val:(now-t.start)/1000};
      else delete TIMERS[pid];
    }
    draw();
  };
  $('#grpStart').onclick=()=>{ groupStart=performance.now(); TIMERS={}; draw(); toast('רץ — הקישו על כל שחקן בחצייה'); };
  $('#grpReset').onclick=()=>{ groupStart=0; TIMERS={}; draw(); };
  $('#saveT').onclick=async()=>{
    const sel=$('#tp'), unit=sel.selectedOptions[0].dataset.u, test=sel.value, dist=+$('#td').value||null;
    const rows=Object.entries(TIMERS).filter(([,v])=>v.done).map(([pid,v])=>({player_id:pid,test,value:+v.val.toFixed(2),unit,distance_m:dist}));
    if(!rows.length) return toast('אין תוצאות');
    await push('coach_tests',rows);
    for(const r of rows){ const norm=Math.max(1,Math.min(5,Math.round(6-((r.value-3)/0.6)))); await addObs(r.player_id,'speed',norm,{source:'test'}); }
    TIMERS={}; draw(); toast(`נשמרו ${rows.length} מדידות`);
  };
  draw();
};

        <span class="v num">${w.avg.toFixed(1)}</span><span class="tr xs muted">${w.n}</span></div>`).join('')}
      <p class="xs muted" style="margin-top:8px">הממוצע הנמוך ביותר בקבוצה — שווה לבנות סביבו את הדגש הבא.</p></div>`:''}
    ${up.length?`<div class="hd"><h2>הכי התקדמו</h2></div><div class="stack">
      ${up.map(r=>`<div class="prow" onclick="go('player','${r.p.id}')"><div class="av">${esc(initials(r.p.name))}</div>
        <div class="pname"><b>${esc(r.p.name)}</b></div><span class="pill ok" dir="ltr">+${r.trend.toFixed(1)}</span></div>`).join('')}</div>`:''}
    ${down.length?`<div class="hd"><h2>בירידה</h2></div><div class="stack">
      ${down.map(r=>`<div class="prow" onclick="go('player','${r.p.id}')"><div class="av">${esc(initials(r.p.name))}</div>
        <div class="pname"><b>${esc(r.p.name)}</b></div><span class="pill bad" dir="ltr">${r.trend.toFixed(1)}</span></div>`).join('')}</div>`:''}
    <div class="hd"><h2>נוכחות</h2></div>

};

  screen('יומן משמעת', '<div class="empty">טוען…</div>');
  const ids=S.players.map(p=>p.id);
  const {data}=ids.length?await sb.from('coach_discipline').select('*').in('player_id',ids).order('at',{ascending:false}).limit(60):{data:[]};
  const flag={}; (data||[]).filter(d=>!d.positive&&daysAgo(d.at)<=30).forEach(d=>flag[d.player_id]=(flag[d.player_id]||0)+1);
  $('.wrap').innerHTML=`
    ${Object.entries(flag).filter(([,n])=>n>=3).map(([pid,n])=>{const p=S.players.find(x=>x.id===pid)||{name:'—'};
      return `<div class="prow" style="border-color:var(--bad)"><div class="av">${esc(initials(p.name))}</div>
        <div class="pname"><b>${esc(p.name)}</b><span class="xs muted">${n} אירועים ב-30 יום</span></div><span class="pill bad">דגל</span></div>`;}).join('')}
    <div class="hd"><h2>רישומים אחרונים</h2></div>
    <div class="stack">${(data||[]).map(d=>{const p=S.players.find(x=>x.id===d.player_id)||{name:'—'};
      return `<div class="prow" onclick="go('player','${d.player_id}')"><div class="av">${esc(initials(p.name))}</div>
        <div class="pname"><b class="sm">${esc(p.name)} — ${esc(d.kind)}</b>
        <span class="xs muted">${fmtDate(d.at)}${d.action?' · '+esc(d.action):''}${d.parent_notified_at?' · הורה עודכן':''}</span></div>
        <span class="pill ${d.positive?'ok':d.severity>=3?'bad':'warn'}">${d.positive?'חיובי':d.severity}</span></div>`;}).join('')||'<p class="muted sm">אין רישומים.</p>'}</div>`;
};

VIEWS.teamedit = function(){
  const t=S.team; if(!t) return go('settings');
  screen('הגדרות קבוצה', `<div class="card stack">
    <label class="f">שם<input id="tn" value="${esc(t.name)}"></label>
    <label class="f">קבוצת גיל<select id="tap">${Object.entries(AGES).map(([k,v])=>`<option value="${k}" ${k===t.age_profile?'selected':''}>${v}</option>`).join('')}</select></label>
    <div class="grid2">
      <label class="f">אורך אימון<input id="tsm" type="number" class="num" value="${t.session_minutes}"></label>
      <label class="f">סולם דירוג<select id="trs"><option value="3" ${t.rating_scale===3?'selected':''}>3 כוכבים</option><option value="5" ${t.rating_scale===5?'selected':''}>1–5</option></select></label>
    </div>
    <label class="f">פורמט משחק<select id="tmf">${['4v4','5v5','7v7','9v9','11v11'].map(x=>`<option ${x===t.match_format?'selected':''}>${x}</option>`).join('')}</select></label>
    <label class="f row" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="tlm" ${t.league_mode?'checked':''} style="width:auto"> משחקת בליגה</label>
    <label class="f row" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="trp" ${t.rpe_enabled?'checked':''} style="width:auto"> RPE (עומס מורגש) פעיל</label>
    <label class="f row" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="tsp" ${t.show_scores_to_player?'checked':''} style="width:auto"> השחקן רואה ציון מספרי</label>
    <label class="f row" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="tpp" ${t.parent_sees_scores?'checked':''} style="width:auto"> ההורה רואה ציונים</label>
    <button class="btn primary big" id="tsv">שמירה</button>
  </div>
  <div class="card" style="margin-top:10px"><h3>תכונות שמדורגות בקבוצה הזו</h3>
    <div class="chips" style="margin-top:8px">${teamAttrs(true).map(a=>`<span class="chip">${esc(a.label)}</span>`).join('')}</div>
    <p class="xs muted" style="margin-top:8px">נקבע אוטומטית לפי קבוצת הגיל.</p></div>`);
  $('#tsv').onclick=async()=>{
    const row={name:$('#tn').value.trim()||t.name,age_profile:$('#tap').value,session_minutes:+$('#tsm').value||60,
      rating_scale:+$('#trs').value,match_format:$('#tmf').value,league_mode:$('#tlm').checked,
      rpe_enabled:$('#trp').checked,show_scores_to_player:$('#tsp').checked,parent_sees_scores:$('#tpp').checked};
    const {error}=await sb.from('coach_teams').update(row).eq('id',t.id);
    if(error) return toast('שגיאה: '+error.message);
    Object.assign(S.team,row); S.teams=S.teams.map(x=>x.id===t.id?S.team:x);
    toast('נשמר'); go('home');
  };
};

VIEWS.settings = function(){
  screen('מועדון וקבוצות', `
    <div class="card"><h2>${esc(S.club?.name||'')}</h2><p class="muted sm">${S.teams.length} קבוצות</p></div>
    <div class="hd"><h2>קבוצות</h2></div>
    <div class="stack">${S.teams.map(t=>`<div class="prow" onclick="pickTeam('${t.id}')">
      <div class="av">${esc(t.name[0]||'')}</div><div class="pname"><b>${esc(t.name)}</b>
      <span class="xs muted">${AGES[t.age_profile]} · ${t.session_minutes} דק׳${t.league_mode?' · ליגה':''}</span></div>
      ${t.id===S.team?.id?'<span class="pill ok">נוכחית</span>':''}</div>`).join('')}</div>
    <div class="card stack" style="margin-top:14px">
      <h3>קבוצה חדשה</h3>
      <label class="f">שם<input id="ntn" placeholder="כיתה ה׳"></label>
      <label class="f">קבוצת גיל<select id="ntap">${Object.entries(AGES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="f">אורך אימון<input id="ntsm" type="number" class="num" value="60"></label>
      <button class="btn primary" id="ntmk">יצירה</button>
    </div>`);
  $('#ntmk').onclick=async()=>{
    const name=$('#ntn').value.trim(); if(!name) return toast('חסר שם');
    const {data,error}=await sb.from('coach_teams').insert({club_id:S.club.id,name,age_profile:$('#ntap').value,
      session_minutes:+$('#ntsm').value||60,coach_id:S.user.id}).select().single();
    if(error) return toast('שגיאה: '+error.message);
    S.teams.push(data); S.team=data; await loadTeam(); toast('נוצרה'); go('home');
  };
};
</script>
</body>
